<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprova Professor — Conceição do Almeida 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><meta name="theme-color" content="#17191F">
<style>
:root{--char:#17191F;--off:#F7F6F2;--ivory:#F0EEE8;--sage:#A8B5A0;--forest:#35483D;--champ:#C5AD83;--slate:#858A91;--line:#E6E4DE;
--bg:var(--off);--card:#FCFBF8;--soft:var(--ivory);--tx:var(--char);--mut:#6B7078;--bd:var(--line);
--pri:var(--forest);--prit:#F7F6F2;--navy:var(--forest);--blue:var(--forest);--ok:#4C6B55;--err:#A4574A;--red:#A4574A;
--l1:#CBD3C5;--l2:var(--sage);--l3:var(--forest);--acc:var(--champ);--r:16px;--sh:none;
--hd:'Manrope','Plus Jakarta Sans',Inter,system-ui,sans-serif;--bn:var(--char);--bnt:#A9ADB3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17191F;--card:#1F2229;--soft:#262A32;--tx:#F0EEE8;--mut:#A3A8AF;--bd:#2D313A;--pri:#A8B5A0;--prit:#17191F;--navy:#A8B5A0;--blue:#A8B5A0;--ok:#A8B5A0;--err:#D08A7C;--red:#D08A7C;--l1:#3A4A40;--l2:#7E9283;--l3:#A8B5A0;--bn:#121418}}
:root[data-theme=dark]{--bg:#17191F;--card:#1F2229;--soft:#262A32;--tx:#F0EEE8;--mut:#A3A8AF;--bd:#2D313A;--pri:#A8B5A0;--prit:#17191F;--navy:#A8B5A0;--blue:#A8B5A0;--ok:#A8B5A0;--err:#D08A7C;--red:#D08A7C;--l1:#3A4A40;--l2:#7E9283;--l3:#A8B5A0;--bn:#121418}
*{box-sizing:border-box}html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,.big,nav .lg{font-family:var(--hd)}
a{color:var(--pri);text-underline-offset:3px}button,select,input,textarea{font:inherit;color:inherit}
#app{display:block;min-height:100vh}
.wrap{max-width:800px;margin:0 auto}
main{margin-left:92px;padding:40px 32px 72px;min-width:0}
h1{font-size:28px;line-height:1.2;margin:0 0 8px;letter-spacing:-.02em;font-weight:700}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.01em;font-weight:700}
h3{font-size:14px;margin:0 0 6px;font-weight:600;color:var(--mut)}
h4{font-size:15px;margin:16px 0 4px;font-weight:700}
.sub{color:var(--mut);margin:0 0 26px;max-width:60ch}
.mut{color:var(--mut);font-size:13px}.sp{flex:1}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* nav */
nav{position:fixed;left:0;top:0;bottom:0;width:92px;background:var(--bn);padding:18px 8px;display:flex;flex-direction:column;gap:4px;z-index:20}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:62px;padding:8px 2px;border-radius:14px;color:var(--bnt);text-decoration:none;font-size:11px;font-weight:500;letter-spacing:.01em;text-align:center;transition:background .2s,color .2s;position:relative}
nav a:hover{background:rgba(255,255,255,.06);color:#F0EEE8}
nav a.on{background:rgba(168,181,160,.14);color:#F7F6F2}
nav a.on::before{content:"";position:absolute;left:-8px;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--champ)}
/* surfaces */
.c{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:22px;box-shadow:none}
.soft{background:var(--soft)}
.hero{background:var(--forest);color:#F7F6F2;border:0}.hero .sub{color:#C9D2C3}
.hero2{background:var(--soft);border:1px solid var(--bd);border-radius:20px;padding:28px}
.hero2 h1{font-size:30px}
.top{display:flex;gap:18px;align-items:center}
.big{font-size:60px;font-weight:700;line-height:1;letter-spacing:-.04em}
.ringw{text-align:center}.ring{width:92px;height:92px;color:var(--tx)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:-8px 0 26px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;color:var(--mut);text-decoration:none;font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
.tabs a:hover{color:var(--tx)}.tabs a.on{color:var(--tx);border-color:var(--champ)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:40px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer;transition:background .2s,color .2s}
.seg .on{background:var(--card);color:var(--tx);box-shadow:0 0 0 1px var(--bd)}
/* buttons */
.btn{background:var(--pri);color:var(--prit);border:0;border-radius:12px;padding:10px 18px;min-height:44px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .15s,background .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.r{background:var(--champ);color:#17191F}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.o:hover:not(:disabled){background:var(--soft)}
.btn.sm{min-height:36px;padding:6px 13px;font-size:14px;border-radius:10px}
.btn.wide{width:100%;margin-top:14px}
.btn:hover:not(:disabled){opacity:.92}.btn:active:not(:disabled){transform:scale(.98)}.btn:disabled{opacity:.4;cursor:not-allowed}
a.btn{display:inline-flex}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
/* inputs */
input[type=url],input[type=text],input[type=search],textarea,select,input[type=date],input[type=number]{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:46px;width:100%;max-width:100%;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--sage);outline:none;box-shadow:0 0 0 3px rgba(168,181,160,.3)}
.row input[type=url],.row input[type=search],.row textarea{flex:1;min-width:0}.row select{width:auto}
input[type=checkbox]{min-height:0;width:auto;accent-color:var(--forest)}
textarea{resize:vertical;line-height:1.5}
.form label{display:block;margin-bottom:16px;font-weight:600;font-size:14px}
.form label input,.form label select,.form label textarea{margin-top:6px;font-weight:400}
.form label.btn{display:inline-flex;margin:0}
.err{color:var(--err);font-size:13px;margin:-6px 0 10px}
/* tags / progress */
.pb{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .5s ease}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--mut);border:1px solid var(--bd)}
.tag.r{background:rgba(164,87,74,.1);color:var(--err);border-color:transparent}.tag.g1{background:rgba(168,181,160,.22);color:var(--forest);border-color:transparent}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.g1{color:var(--sage)}}
.lv0{background:var(--slate)}.lv1{background:var(--l1)}.lv2{background:var(--l2)}.lv3{background:var(--l3)}.lv4{background:var(--ok)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
/* options / feedback */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:8px 0;cursor:pointer;line-height:1.5;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--sage);background:var(--soft)}.opt:disabled{cursor:default;opacity:1;color:var(--tx)}
.opt.sel{border-color:var(--forest);background:rgba(168,181,160,.18)}
.opt.ok{border-color:var(--ok);background:rgba(76,107,85,.12)}.opt.bad{border-color:var(--err);background:rgba(164,87,74,.1)}
.fb{border-left:3px solid var(--ok);background:rgba(76,107,85,.08);padding:14px 16px;border-radius:4px 12px 12px 4px;margin-top:14px}
.fb.bad{border-color:var(--err);background:rgba(164,87,74,.07)}
.warn{background:rgba(197,173,131,.16);border:1px solid rgba(197,173,131,.5);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px}
/* tables, details */
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px;letter-spacing:.02em}
details{border-top:1px solid var(--bd);padding:10px 0}summary{cursor:pointer;font-weight:600;min-height:32px}
.sec summary{font-family:var(--hd);padding:6px 0;min-height:40px}.sec ul{margin:6px 0 12px;padding-left:20px}dt{font-weight:700;margin-top:10px}dd{margin:2px 0 0;color:var(--mut)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}details[open]>.clamp{-webkit-line-clamp:unset;display:block}
/* grid / heat */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}.grid button{height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer}.grid .a{background:var(--pri);color:var(--prit);border-color:transparent}.grid .m{border-color:var(--champ);box-shadow:inset 0 0 0 2px var(--champ)}.grid .n{outline:2px solid var(--tx)}
.hm{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;gap:3px}.hm i{width:14px;height:14px;border-radius:3px;background:var(--bd)}
/* list rows */
.list{padding:4px 20px}.li{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;border-bottom:1px solid var(--bd);padding:15px 0;text-align:left;cursor:pointer;min-height:58px;transition:padding .2s}
.li:hover{padding-left:4px}.li:last-child{border:0}.li small{display:block;color:var(--mut);font-size:13px}.li i{font-style:normal;color:var(--mut);font-size:22px}
.qz{border-top:1px solid var(--bd);padding-top:12px;margin-top:12px}
.th{position:relative;flex:none;width:96px;aspect-ratio:16/9;background:var(--soft);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--mut)}.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.th span{position:relative;font-size:16px}
.lib{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--bd)}.lib:last-child{border:0}.col{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--forest);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
/* summarizer */
.urlbox{display:flex;gap:10px;flex-wrap:wrap}.urlbox input{flex:1;min-width:0;min-height:54px;font-size:16px;border-radius:14px}.urlbox .btn{min-height:54px;padding:0 24px;border-radius:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);background:var(--card);transition:all .2s}
.chip.on{background:var(--pri);color:var(--prit);border-color:transparent}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--bd),var(--soft),var(--bd));background-size:200% 100%;animation:sh 1.4s linear infinite;margin:10px 0}@keyframes sh{to{background-position:-200% 0}}
.src{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;margin-bottom:2px;background:var(--soft);color:var(--mut);border:1px solid var(--bd)}
.src.video{background:rgba(168,181,160,.25);color:var(--forest);border-color:transparent}.src.edital{background:rgba(197,173,131,.3);color:#6b5a38;border-color:transparent}.src.ia{background:var(--soft)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .src.video{color:var(--sage)}:root:not([data-theme=light]) .src.edital{color:var(--champ)}}
.grp{margin:12px 0}
.kc dt{display:inline;background:linear-gradient(transparent 62%,rgba(197,173,131,.4) 62%);padding:0 2px}.kc dd{margin:2px 0 10px}
.more{position:relative;border:0;padding:0}.more>summary{list-style:none;display:inline-flex;min-height:36px;padding:6px 13px;border:1px solid var(--bd);border-radius:10px;font-size:14px;font-weight:600}.more>summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;min-width:210px;margin-top:6px;display:flex;flex-direction:column}
.menu button,.menu a{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:40px;color:var(--tx);text-decoration:none;font-size:14px}.menu button:hover,.menu a:hover{background:var(--soft)}
.fav{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;min-width:36px;min-height:36px;color:var(--champ)}
/* flashcards */
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px;border-radius:20px;background:var(--soft);border:1px solid var(--bd);font-family:var(--hd);font-size:20px;line-height:1.4;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fc small{font-family:Inter,sans-serif;font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
/* chat */
.chat{min-height:200px;display:flex;flex-direction:column;gap:14px;max-width:720px}
.bub{padding:12px 16px;border-radius:16px;max-width:92%;line-height:1.6;position:relative;overflow-wrap:anywhere}
.bub.user{align-self:flex-end;background:var(--forest);color:#F7F6F2;white-space:pre-wrap}
.bub.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.bub .cp{position:absolute;right:6px;top:6px;opacity:0;font-size:12px;padding:3px 9px;min-height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--card);cursor:pointer;transition:opacity .15s}
.bub:hover .cp,.bub .cp:focus-visible{opacity:1}
@media(hover:none){.bub .cp{opacity:.8;position:static;display:block;margin-top:8px}}
.md p{margin:0 0 .7em}.md ul,.md ol{margin:.3em 0 .8em;padding-left:1.3em}.md h4{margin:.8em 0 .3em}.md pre{background:var(--soft);padding:12px;border-radius:10px;overflow-x:auto;font-size:13px}.md code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.9em}.md pre code{padding:0;background:none}
.md :last-child{margin-bottom:0}
.chipbtn{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:13px;min-height:40px;transition:background .15s}.chipbtn:hover{background:var(--soft)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--char);color:#F7F6F2;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:821px){#toast{bottom:32px}}
/* mobile */
@media(max-width:820px){
 nav{top:auto;left:0;right:0;bottom:0;width:100%;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;border-top:1px solid rgba(255,255,255,.08)}
 nav a{flex:1;min-width:0;min-height:54px;padding:6px 2px;font-size:10.5px}nav a.on::before{left:30%;right:30%;top:0;bottom:auto;width:auto;height:2px;border-radius:0 0 3px 3px}
 main{margin-left:0;padding:24px 16px calc(100px + env(safe-area-inset-bottom,0px))}
 h1{font-size:24px}.hero2{padding:20px}.hero2 h1{font-size:25px}.big{font-size:48px}.lib{flex-direction:column}.col{align-items:flex-start}.th{width:84px}
 .urlbox .btn{width:100%}.c{padding:18px}.bub{max-width:100%}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{nav,.tabs,.np,#toast{display:none!important}main{margin:0;padding:0}body{background:#fff;color:#000}.c{border:0}}
.c.li{padding:18px 20px;border-radius:var(--r)}.c.li:hover{padding-left:20px;background:var(--soft)}
</style></head><body><div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const D={"syl": {"lp": [{"t": "Textos", "d": "Textos: Leitura, compreensão e interpretação de textos. Vocabulário: significado e substituição contextual. Reorganização da estrutura de orações e períodos do texto. Mecanismos de coesão e coerência textual. Tipos e gêneros textuais."}, {"t": "Fono-ortografia", "d": "Fono-ortografia: Relações entre fonemas e grafemas no português. Estrutura, divisão e classificação silábica. Processos fonológicos."}, {"t": "Morfossintaxe", "d": "Morfossintaxe: Classes de palavras: classificação e uso. Processos de formação de palavras. Flexão nominal: gênero, número e grau. Flexão verbal: pessoas, tempos, número, modos, vozes e aspectos. Concordância nominal e verbal. Regência nominal e verbal. Relação entre classes de palavras e funções sintáticas."}, {"t": "Sintaxe", "d": "Sintaxe: Funções sintáticas: sujeito, predicado, objeto, complementos, modificadores. Período simples e composto: relações de coordenação e subordinação. Análise sintática completa. Correlação entre concordância, regência e retomada. Organização sintática canônica e variações estilísticas. Emprego do sinal indicativo de crase. Colocação pronominal."}, {"t": "Semântica", "d": "Semântica: Sinonímia, antonímia, polissemia. Homônimos e parônimos. Denotação e conotação. Figuras de linguagem (metáfora, comparação, metonímia, ironia, eufemismo, hipérbole, personificação etc.). Efeitos de sentido em textos argumentativos, literários e multimodais."}, {"t": "Variação Linguística", "d": "Variação Linguística: Variedades regionais, sociais, históricas e situacionais da língua portuguesa. Norma-padrão e usos sociais da língua."}, {"t": "Elementos Notacionais da Escrita", "d": "Elementos Notacionais da Escrita: Ortografia oficial. Acentuação gráfica. Sinais de pontuação. Recursos gráficos e estilísticos: aspas, parênteses, travessão, negrito, itálico. Regularidades e irregularidades ortográficas na produção textual."}], "mat": [{"t": "Números e Conjuntos", "d": "Números e Conjuntos: Teoria dos conjuntos: operações, diagramas e subconjuntos. Sistemas de numeração. Conjuntos numéricos: naturais, inteiros, racionais, irracionais e reais: operações e propriedades. Expressões numéricas. Reta numérica, desigualdades e valor absoluto. Divisibilidade, múltiplos, divisores, MDC e MMC. Fatoração e produtos notáveis. Agrupamentos usuais (dúzia, centena, milhar etc.). Numerais multiplicativos. Notação científica e ordens de grandeza. Razões, proporções e regra de três. Porcentagem. Sequências, progressões (PA, PG) e séries. Análise combinatória."}, {"t": "Álgebra e Funções", "d": "Álgebra e Funções: Expressões algébricas, polinômios e frações algébricas. Equações e inequações do 1º e 2º graus. Equações polinomiais de grau superior. Sistemas lineares: métodos algébricos, matrizes e determinantes. Funções: afim, quadrática, polinomiais, racionais, exponenciais, logarítmicas e trigonométricas. Logaritmos: propriedades, equações e aplicações. Gráficos e transformações de funções."}, {"t": "Geometria e Medidas", "d": "Geometria e Medidas: Geometria Plana: polígonos, circunferência e círculo; perímetro, área e ângulos. Relações métricas em triângulos: semelhança, Teorema de Tales, Teorema de Pitágoras. Trigonometria básica: razões trigonométricas, ciclo trigonométrico. Escalas, ângulos e proporcionalidade. Geometria Espacial: prismas, pirâmides, cilindros, cones e esferas; áreas, volumes e planificações. Geometria analítica: plano cartesiano, ponto, distância, ponto médio, equação da reta, circunferência, parábola. Transformações geométricas: translação, rotação, reflexão. Unidades de medida e conversões."}, {"t": "Matemática Financeira", "d": "Matemática Financeira: Sistema monetário brasileiro. Operações de compra e venda. Juros simples e compostos. Descontos, lucro, perda, taxas e equivalência de taxas. Inflação, amortizações, financiamentos e aplicações financeiras."}, {"t": "Probabilidade e Estatística", "d": "Probabilidade e Estatística: Representação e análise de dados. Variáveis estatísticas, distribuição de frequência e intervalos de classe. Medidas de tendência central (média, moda, mediana) e de dispersão (amplitude, variância, desvio padrão). Probabilidade simples, composta e condicional. Noções de distribuições binomial e normal."}, {"t": "Raciocínio Lógico e Resolução de Problemas", "d": "Raciocínio Lógico e Resolução de Problemas: Fundamentos de lógica. Estruturas lógicas: sequências, séries, padrões, analogias, relações e classificações. Identificação de padrões e regularidades. Resolução de problemas matemáticos em contextos diversos."}], "esp": {"Professor (Anos Iniciais / Educação Infantil)": [{"t": "Temas Educacionais e Pedagógicos", "d": "Temas Educacionais e Pedagógicos: Psicologia da educação, da aprendizagem e do desenvolvimento, incluindo neurociência. Planejamento e organização do trabalho pedagógico. Gestão democrática na escola. Teoria e prática de currículo, incluindo o projeto político-pedagógico. Interação entre escola, família e comunidade. Relações entre educação, sociedade e prática escolar. Educação em Direitos Humanos. Educação ambiental. Educação Socioemocional. Educação integral. Educação Especial/Inclusiva. Educação a distância. Uso de tecnologias da informação e comunicação na educação. Práticas pedagógicas e construção do conhecimento. Didática e prática histórico-cultural. Tendências pedagógicas na prática escolar. Concepções didático-pedagógicas e prática educativa. Metodologias de ensino. Processos de ensino e de aprendizagem. Relação professor/aluno. Compromisso social e ético do professor. Prática docente e gestão escolar. Organização do trabalho pedagógico em sala de aula. Componentes do processo de ensino: objetivos, conteúdos, métodos, estratégias e meios. Competências gerais da Educação Básica. Avaliação e suas implicações pedagógicas. Organização do ensino na Educação Básica. Temáticas relevantes no contexto escolar brasileiro: evasão e abandono escolar, comportamento e indisciplina, defasagem da aprendizagem, sucesso e fracasso escolar, violência e drogas, entre outros. Transtornos e Condições do Neurodesenvolvimento e Aprendizagem. Base Nacional Comum Curricular: introdução e estrutura."}, {"t": "Educação infantil", "d": "Educação infantil: Fundamentos, concepções, finalidades e princípios da Educação Infantil. Desenvolvimento infantil. Teorias do desenvolvimento e aprendizagem infantil. Abordagens pedagógicas e metodologia de ensino. Ludicidade na Educação Infantil. Interações, jogos, brincadeiras e atividades lúdicas na Educação Infantil. Currículo e planejamento pedagógico na Educação Infantil. Eixos estruturantes das práticas pedagógicas na Educação Infantil. Aprendizagens essenciais na Educação Infantil: comportamentos, habilidades, conhecimentos e vivências. Direitos de aprendizagem e desenvolvimento na Educação Infantil. Práticas pedagógicas na Educação Infantil. Ambiente educativo: organização, espaço físico, tempo e materiais pedagógicos na Educação Infantil. Mediação e intervenção pedagógica na Educação Infantil. Documentação pedagógica e práticas de registro na Educação Infantil. Planejamento, gestão e rotina do trabalho pedagógico na Educação Infantil. Avaliação na Educação Infantil. Tecnologias educacionais na Educação Infantil. Educação inclusiva e diversidade na Educação Infantil. Relação escola e família. Educação Infantil e educação ambiental. Projetos e práticas interdisciplinares na Educação Infantil. Processos de aquisição e desenvolvimento da linguagem oral e escrita na Educação Infantil. Matemática na Educação Infantil. Saúde, alimentação, higiene e cuidados essenciais na Educação Infantil. Base Nacional Comum Curricular: etapa da Educação Infantil."}, {"t": "Anos Iniciais", "d": "Anos Iniciais: Fundamentos, concepções, finalidades e princípios da educação dos Anos Iniciais. Desenvolvimento integral das crianças. Teorias do desenvolvimento e aprendizagem. Abordagens pedagógicas e metodologia de ensino. Lu "}, {"id": "estrela26-ai-4", "ex": "estrela26-ai", "n": 4, "c": "lp", "s": "Quanto à formação do plural de adjetivos compostos, analisar os itens. I. Comprei várias roupas azuis-marinho, pois essa cor está em alta no momento. II. Os acordos luso-brasileiros foram firmados. III. Encontrei várias estrelas-do-mar pela praia. Está CORRETO o que se afirma:", "o": {"A": "Apenas no item I.", "B": "Apenas nos itens I e II.", "C": "Apenas nos itens II e III.", "D": "Em nenhum dos itens.", "E": "Em todos os itens."}, "a": "A"}, {"id": "estrela26-ai-6", "ex": "estrela26-ai", "n": 6, "c": "lp", "s": "Sobre a concordância nominal, analisar os itens. I. As filhas são tais qual a mãe. II. É necessário muita paciência para lidar com essa situação. III. Todos ficaram alertas diante do perigo iminente. Está CORRETO o que se afirma:", "o": {"A": "Apenas no item I.", "B": "Apenas no item II.", "C": "Apenas nos itens I e III.", "D": "Apenas nos itens II e III.", "E": "Em todos os itens."}, "a": "B"}, {"id": "estrela26-ai-7", "ex": "estrela26-ai", "n": 7, "c": "lp", "s": "Assinalar a alternativa em que todas as palavras foram formadas pelo mesmo processo de formação de palavras.", "o": {"A": "Espairecer | boteco | prodígio.", "B": "Folhagem | beleza | bondade.", "C": "Amoroso | desleal | recompor.", "D": "Antebraço | sabiamente | florir.", "E": "Aguardente | pontapé | foto."}, "a": "D"}, {"id": "estrela26-ai-8", "ex": "estrela26-ai", "n": 8, "c": "lp", "s": "A respeito da transitividade verbal, assinalar a alternativa que apresenta um verbo intransitivo.", "o": {"A": "Minha mãe não acreditou em mim.", "B": "Helen comprou roupas na loja.", "C": "João deu flores à Sofia.", "D": "Amanda nasceu ontem.", "E": "André está muito feliz."}, "a": "C"}, {"id": "estrela26-ai-9", "ex": "estrela26-ai", "n": 9, "c": "lp", "s": "Assinalar a alternativa em que o uso da crase é facultativo.", "o": {"A": "À medida que o tempo passa, mais saudades eu sinto.", "B": "Veste roupas à moda alternativa.", "C": "Caminharemos até à quadra de esportes.", "D": "Termino meu trabalho às cinco horas da tarde.", "E": "Você vai à padaria agora?"}, "a": "B"}, {"id": "estrela26-ai-10", "ex": "estrela26-ai", "n": 10, "c": "lp", "s": "Sobre colocação pronominal, assinalar a alternativa CORRETA.", "o": {"A": "No hospital, os enfermeiros informaram-me sobre o horário da visita.", "B": "Me servi de uma xícara de café antes de começar o trabalho.", "C": "No mercado, sempre comprar-se-ão frutas frescas aos sábados.", "D": "Quando fui à biblioteca, me emprestaram um livro de aventuras.", "E": "Nunca esqueci-me de sua gentileza."}, "a": "A"}, {"id": "estrela26-ai-11", "ex": "estrela26-ai", "n": 11, "c": "mat", "s": "Uma pesquisa foi realizada com 100 funcionários de uma empresa a respeito da preferência por três modalidades esportivas. Obtiveram-se as seguintes respostas: 50 gostam de futebol, 40 gostam de vôlei, 30 gostam de natação, 15 gostam de futebol e vôlei, 10 gostam de futebol e natação, 8 gostam de vôlei e natação e 5 gostam das três modalidades. Sendo assim, quantos funcionários não gostam de nenhuma das três modalidades?", "o": {"A": "6", "B": "7", "C": "8", "D": "9", "E": "10"}, "a": "D"}, {"id": "estrela26-ai-12", "ex": "estrela26-ai", "n": 12, "c": "mat", "s": "As notas de Maria em seis atividades foram 7, 7, 7, 8, 9 e 10. Assinalar a alternativa que apresenta CORRETAMENTE a média, a moda e a mediana dessas notas.", "o": {"A": "Média = 8, moda = 7 e mediana = 7,5", "B": "Média = 7,5, moda = 7 e mediana = 7,5", "C": "Média = 8, moda = 7,5 e mediana = 8", "D": "Média = 7, moda = 8 e mediana = 7,5", "E": "Média = 8, moda = 7 e mediana = 8"}, "a": "B"}, {"id": "estrela26-ai-13", "ex": "estrela26-ai", "n": 13, "c": "mat", "s": "Uma urna contém 4 bolas vermelhas, 3 bolas verdes e 5 bolas azuis. Retirando-se uma bola aleatoriamente dessa urna, qual é a probabilidade de ela ser verde?", "o": {"A": "1/12", "B": "1/5", "C": "1/4", "D": "1/3", "E": "5/12"}, "a": "C"}, {"id": "estrela26-ai-15", "ex": "estrela26-ai", "n": 15, "c": "mat", "s": "Uma prefeitura decidiu dividir uma verba de R$ 480.000,00 entre três setores administrativos, de forma diretamente proporcional ao número de projetos de cada um deles: 3, 5 e 8 projetos. Considerando essas informações, qual é o valor que o setor com maior número de projetos irá receber?", "o": {"A": "R$ 90.000,00", "B": "R$ 120.000,00", "C": "R$ 180.000,00", "D": "R$ 220.000,00", "E": "R$ 240.000,00"}, "a": "D"}, {"id": "estrela26-ai-17", "ex": "estrela26-ai", "n": 17, "c": "mat", "s": "O conselho de um condomínio deve ser composto por 3 membros, sendo que será escolhido um morador por andar do prédio. O primeiro andar tem 5 moradores, o segundo, 4, e o terceiro, 6. De quantas formas diferentes esse conselho pode ser formado?", "o": {"A": "80", "B": "90", "C": "100", "D": "120", "E": "130"}, "a": "C"}, {"id": "estrela26-ai-19", "ex": "estrela26-ai", "n": 19, "c": "mat", "s": "Em uma campanha promocional, uma loja de eletrônicos concedeu um desconto de 15% sobre o preço de um produto que custava R$ 900,00. Para incentivar o pagamento à vista, a loja ofereceu mais 5% de desconto sobre o novo valor. Nessas condições, o cliente que comprou o produto e realizou o pagamento à vista recebeu um desconto extra no valor de:", "o": {"A": "R$ 26,75", "B": "R$ 38,25", "C": "R$ 39,25", "D": "R$ 42,50", "E": "R$ 45,00"}, "a": "B"}, {"id": "estrela26-ai-20", "ex": "estrela26-ai", "n": 20, "c": "mat", "s": "A produção de uma fábrica é de 480 peças em 5 dias, trabalhando 6 horas por dia. Quantas peças serão produzidas em 4 dias se a fábrica passar a trabalhar 8 horas por dia?", "o": {"A": "600", "B": "584", "C": "546", "D": "522", "E": "512"}, "a": "A"}, {"id": "estrela26-ai-31", "ex": "estrela26-ai", "n": 31, "c": "esp", "s": "Conforme a Lei nº 9.394/1996 - Lei de Diretrizes e Bases da Educação Nacional, a educação é responsabilidade conjunta da família e do Estado. Considerando isso, o ensino NÃO será ministrado com base no seguinte princípio:", "o": {"A": "Centralismo de ideias e de concepções pedagógicas.", "B": "Valorização da experiência extraescolar.", "C": "Garantia de padrão de qualidade.", "D": "Respeito à liberdade e apreço à tolerância.", "E": "Gratuidade do ensino público em estabelecimentos oficiais."}, "a": "E"}, {"id": "estrela26-ai-32", "ex": "estrela26-ai", "n": 32, "c": "esp", "s": "A avaliação é função primordial do sistema de organização e gestão. Em relação à avaliação, avaliar se as afirmativas são certas (C) ou erradas (E) e assinalar a sequência correspondente. ( ) Supõe acompanhamento e controle das ações decididas coletivamente, sendo este último composto pela observação e comprovação dos objetivos e das tarefas, a fim de verificar o estado real do trabalho desenvolvido. ( ) Permite pôr em evidência as dificuldades surgidas na prática diária, mediante a confrontação entre o planejamento e o funcionamento real do trabalho. ( ) Visa ao melhoramento do trabalho escolar, pois, conhecendo a tempo as dificuldades, pode-se analisar suas causas e encontrar meios de superá-las. ( ) Busca medir o aprendizado dos alunos e, consequentemente, gerenciar a eficácia das práticas realizadas, tendo como base as percepções pessoais da equipe escolar.", "o": {"A": "C - C - C - E.", "B": "E - E - C - C.", "C": "C - E - E - C.", "D": "E - C - C - C.", "E": "C - C - E - E."}, "a": "B"}, {"id": "estrela26-ai-33", "ex": "estrela26-ai", "n": 33, "c": "esp", "s": "De acordo com a teoria de desenvolvimento humano e aprendizagem de Vygotsky, avaliar se as afirmativas são certas (C) ou erradas (E) e assinalar a sequência correspondente. (_) A zona de desenvolvimento proximal (ZDP) é um dos conceitos centrais nessa teoria. (_) A relação entre o homem e o mundo não é direta, mas sempre mediada por sistemas simbólicos. (_) O autor ressalta que a aprendizagem deve ser vista como resultado e não como processo.", "o": {"A": "E - C - E.", "B": "E - C - C.", "C": "C - E - E.", "D": "C - C - E.", "E": "E - E - E."}, "a": "D"}, {"id": "estrela26-ai-34", "ex": "estrela26-ai", "n": 34, "c": "esp", "s": "Em relação à educação ambiental, analisar os itens. I. É o conjunto das práticas pedagógicas de ensino e orientações informais sobre os comportamentos e atitudes necessários à preservação dos recursos naturais, envolvendo todas as ações que contemplem a manutenção da vida em suas diversas formas de flora e fauna. II. São os processos por meio dos quais o indivíduo e a coletividade constroem valores sociais, conhecimentos, habilidades, atitudes e competências voltados para a conservação do meio ambiente, bem de uso comum do povo, essencial à qualidade de vida e sua sustentabilidade. III. Contribui para a compreensão das causas e dos efeitos das crises ambientais e para a formação de cidadãos conscientes, entretanto, sua finalidade educativa circunscreve-se à apreensão conceitual dessas problemáticas, não abrangendo a revisão de hábitos cotidianos nem a construção de alternativas e inovações sustentáveis voltadas ao enfrentamento das mudanças climáticas. Está CORRETO o que se afirma:", "o": {"A": "Apenas no item I.", "B": "Apenas nos itens I e II.", "C": "Apenas nos itens I e III.", "D": "Apenas nos itens II e III.", "E": "Em todos os itens."}, "a": "C"}, {"id": "estrela26-ai-35", "ex": "estrela26-ai", "n": 35, "c": "esp", "s": "A BNCC apresenta competências e habilidades que orientam as aprendizagens previstas para o Ensino Fundamental. Nesse contexto, o planejamento docente deve:", "o": {"A": "Seguir exclusivamente a sequência de atividades apresentada pelo livro didático.", "B": "Priorizar conteúdos isolados, independentemente das habilidades previstas para cada etapa.", "C": "Substituir o currículo da rede de ensino por uma sequência única definida nacionalmente.", "D": "Organizar todas as aulas a partir de competências gerais, sem considerar as especificidades dos componentes.", "E": "Articular os objetivos de aprendizagem, as habilidades, as características dos estudantes e as situações pedagógicas planejadas."}, "a": "D"}, {"id": "estrela26-ai-36", "ex": "estrela26-ai", "n": 36, "c": "esp", "s": "De acordo com o conceito de alfabetização e letramento, avaliar se as afirmativas são certas (C) ou erradas (E) e assinalar a sequência correspondente. ( ) Alfabetização e letramento são processos cognitivos e linguísticos distintos. ( ) Alfabetização é a relação da aquisição da tecnologia escrita. ( ) Letramento envolve leitura e escrita de textos sobre demandas sociais e culturais de escrita.", "o": {"A": "C - C - C.", "B": "C - E - C.", "C": "C - C - E.", "D": "E - C - E.", "E": "E - C - C."}, "a": "E"}, {"id": "estrela26-ai-37", "ex": "estrela26-ai", "n": 37, "c": "esp", "s": "A teoria do desenvolvimento cognitivo de Piaget destaca a importância da função simbólica para o desenvolvimento intelectual da criança. Em suas pesquisas sobre a formação da capacidade de representação simbólica na criança, ele identificou três estágios principais, que podem ser resumidos pela sequência:", "o": {"A": "Observação simbólica; representação teatral; características imitativas.", "B": "Observação comportamental; desenvolvimento do jogo dramático; interpretação da imitação.", "C": "Imitação; jogo simbólico; representação cognitiva.", "D": "Interpretação; representação do jogo teatral; características psicodramáticas.", "E": "Jogo simbólico dramático; desenvolvimento da imitação; representação comportamental."}, "a": "E"}, {"id": "estrela26-ai-38", "ex": "estrela26-ai", "n": 38, "c": "esp", "s": "Uma escola desenvolveu um projeto sobre o uso da água no município. Durante o trabalho, os estudantes analisaram dados sobre consumo, produziram gráficos, estudaram o ciclo da água, investigaram problemas ambientais locais, produziram textos informativos e discutiram medidas de preservação. Cada professor, entretanto, manteve os objetivos de aprendizagem relacionados ao seu componente curricular. Considerando a perspectiva de integração dos conhecimentos, essa organização:", "o": {"A": "Descaracteriza o currículo, pois os componentes curriculares devem ser trabalhados sempre de forma independente.", "B": "Constitui apenas uma atividade temática, pois a interdisciplinaridade exige a substituição dos componentes por um único conteúdo.", "C": "Caracteriza interdisciplinaridade somente se todas as atividades tiverem exatamente os mesmos objetivos de aprendizagem.", "D": "Impede a avaliação das aprendizagens específicas de cada componente curricular.", "E": "Possibilita a articulação entre diferentes áreas sem eliminar as especificidades dos conhecimentos e objetivos envolvidos."}, "a": "A"}, {"id": "estrela26-ai-39", "ex": "estrela26-ai", "n": 39, "c": "esp", "s": "No 3º ano, um professor apresenta aos estudantes uma situação em que precisam descobrir diferentes maneiras de distribuir igualmente 24 objetos entre grupos. Em seguida, solicita que expliquem como chegaram às respostas. A atividade valoriza principalmente a:", "o": {"A": "Repetição mecânica de procedimentos previamente apresentados.", "B": "Memorização das tabuadas como condição inicial para qualquer resolução.", "C": "Aplicação de um único algoritmo previamente demonstrado pelo professor.", "D": "Resolução de situações-problema e a explicitação das estratégias utilizadas pelos estudantes.", "E": "Substituição dos conhecimentos matemáticos formais por estratégias exclusivamente intuitivas."}, "a": "B"}, {"id": "estrela26-ai-40", "ex": "estrela26-ai", "n": 40, "c": "esp", "s": "Em uma turma do 1º ano, o professor utiliza um jogo de trilha no qual os estudantes precisam resolver pequenas situações de adição para avançar as casas. Durante a atividade, registra estratégias utilizadas pelas crianças e intervém quando identifica dificuldades. Nessa situação, o jogo:", "o": {"A": "Exerce função exclusivamente recreativa e não deve ser utilizado para avaliar aprendizagens.", "B": "Pode constituir uma situação de aprendizagem quando articulado a objetivos pedagógicos e acompanhado pela mediação docente.", "C": "Deve substituir as demais estratégias de ensino, pois favorece espontaneamente todas as aprendizagens.", "D": "É adequado apenas para estudantes que apresentam dificuldades de aprendizagem.", "E": "Deve ser utilizado somente ao final da aula, depois das atividades consideradas propriamente pedagógicas. www.objetivas.com.br"}, "a": "D"}, {"id": "estrela26-ei-3", "ex": "estrela26-ei", "n": 3, "c": "lp", "s": "No trecho “O especialista ressaltou que pesquisas recentes apontam a reabilitação auditiva como um elemento central no combate à demência senil.” (2º parágrafo), os termos da oração destacados são, respectivamente:", "o": {"A": "Adjunto adnominal | complemento nominal.", "B": "Objeto direto | adjunto adnominal.", "C": "Complemento nominal | adjunto adnominal.", "D": "Objeto direto | complemento nominal.", "E": "Objeto indireto | complemento nominal."}, "a": "D"}, {"id": "estrela26-ei-4", "ex": "estrela26-ei", "n": 4, "c": "lp", "s": "Quanto à formação do plural de adjetivos compostos, analisar os itens. I. Comprei várias roupas azuis-marinho, pois essa cor está em alta no momento. II. Os acordos luso-brasileiros foram firmados. III. Encontrei várias estrelas-do-mar pela praia. Está CORRETO o que se afirma:", "o": {"A": "Apenas no item I.", "B": "Apenas nos itens I e II.", "C": "Apenas nos itens II e III.", "D": "Em nenhum dos itens.", "E": "Em todos os itens."}, "a": "C"}, {"id": "estrela26-ei-6", "ex": "estrela26-ei", "n": 6, "c": "lp", "s": "Sobre a concordância nominal, analisar os itens. I. As filhas são tais qual a mãe. II. É necessário muita paciência para lidar com essa situação. III. Todos ficaram alertas diante do perigo iminente. Está CORRETO o que se afirma:", "o": {"A": "Apenas no item I.", "B": "Apenas no item II.", "C": "Apenas nos itens I e III.", "D": "Apenas nos itens II e III.", "E": "Em todos os itens."}, "a": "A"}, {"id": "estrela26-ei-7", "ex": "estrela26-ei", "n": 7, "c": "lp", "s": "Assinalar a alternativa em que todas as palavras foram formadas pelo mesmo processo de formação de palavras.", "o": {"A": "Espairecer | boteco | prodígio.", "B": "Folhagem | beleza | bondade.", "C": "Amoroso | desleal | recompor.", "D": "Antebraço | sabiamente | florir.", "E": "Aguardente | pontapé | foto."}, "a": "B"}, {"id": "estrela26-ei-8", "ex": "estrela26-ei", "n": 8, "c": "lp", "s": "A respeito da transitividade verbal, assinalar a alternativa que apresenta um verbo intransitivo.", "o": {"A": "Minha mãe não acreditou em mim.", "B": "Helen comprou roupas na loja.", "C": "João deu flores à Sofia.", "D": "Amanda nasceu ontem.", "E": "André está muito feliz."}, "a": "D"}, {"id": "estrela26-ei-9", "ex": "estrela26-ei", "n": 9, "c": "lp", "s": "Assinalar a alternativa em que o uso da crase é facultativo.", "o": {"A": "À medida que o tempo passa, mais saudades eu sinto.", "B": "Veste roupas à moda alternativa.", "C": "Caminharemos até à quadra de esportes.", "D": "Termino meu trabalho às cinco horas da tarde.", "E": "Você vai à padaria agora?"}, "a": "C"}, {"id": "estrela26-ei-10", "ex": "estrela26-ei", "n": 10, "c": "lp", "s": "Sobre colocação pronominal, assinalar a alternativa CORRETA.", "o": {"A": "No hospital, os enfermeiros informaram-me sobre o horário da visita.", "B": "Me servi de uma xícara de café antes de começar o trabalho.", "C": "No mercado, sempre comprar-se-ão frutas frescas aos sábados.", "D": "Quando fui à biblioteca, me emprestaram um livro de aventuras.", "E": "Nunca esqueci-me de sua gentileza."}, "a": "A"}, {"id": "estrela26-ei-11", "ex": "estrela26-ei", "n": 11, "c": "mat", "s": "Uma pesquisa foi realizada com 100 funcionários de uma empresa a respeito da preferência por três modalidades esportivas. Obtiveram-se as seguintes respostas: 50 gostam de futebol, 40 gostam de vôlei, 30 gostam de natação, 15 gostam de futebol e vôlei, 10 gostam de futebol e natação, 8 gostam de vôlei e natação e 5 gostam das três modalidades. Sendo assim, quantos funcionários a incentivar o pagamento à vista, a loja ofereceu mais 5% de desconto sobre o novo valor. Nessas condições, o cliente que comprou o produto e realizou o pagamento à vista recebeu um desconto extra no valor de:", "o": {"A": "R$ 26,75", "B": "R$ 38,25", "C": "R$ 39,25", "D": "R$ 42,50", "E": "R$ 45,00"}, "a": "B"}, {"id": "estrela26-ei-20", "ex": "estrela26-ei", "n": 20, "c": "mat", "s": "A produção de uma fábrica é de 480 peças em 5 dias, trabalhando 6 horas por dia. Quantas peças serão produzidas em 4 dias se a fábrica passar a trabalhar 8 horas por dia?", "o": {"A": "600", "B": "584", "C": "546", "D": "522", "E": "512"}, "a": "E"}, {"id": "estrela26-ei-31", "ex": "estrela26-ei", "n": 31, "c": "esp", "s": "Conforme a Lei nº 9.394/1996 - Lei de Diretrizes e Bases da Educação Nacional, a educação é responsabilidade conjunta da família e do Estado. Considerando isso, o ensino NÃO será ministrado com base no seguinte princípio:", "o": {"A": "Centralismo de ideias e de concepções pedagógicas.", "B": "Valorização da experiência extraescolar.", "C": "Garantia de padrão de qualidade.", "D": "Respeito à liberdade e apreço à tolerância.", "E": "Gratuidade do ensino público em estabelecimentos oficiais."}, "a": "A"}, {"id": "estrela26-ei-32", "ex": "estrela26-ei", "n": 32, "c": "esp", "s": "A avaliação é função primordial do sistema de organização e gestão. Em relação à avaliação, avaliar se as afirmativas são certas (C) ou erradas (E) e assinalar a sequência correspondente. ( ) Supõe acompanhamento e controle das ações decididas coletivamente, sendo este último composto pela observação e comprovação dos objetivos e das tarefas, a fim de verificar o estado real do trabalho desenvolvido. ( ) Permite pôr em evidência as dificuldades surgidas na prática diária, mediante a confrontação entre o planejamento e o funcionamento real do trabalho. ( ) Visa ao melhoramento do trabalho escolar, pois, conhecendo a tempo as dificuldades, pode-se analisar suas causas e encontrar meios de superá-las. ( ) Busca medir o aprendizado dos alunos e, consequentemente, gerenciar a eficácia das práticas realizadas, tendo como base as percepções pessoais da equipe escolar.", "o": {"A": "C - C - C - E.", "B": "E - E - C - C.", "C": "C - E - E - C.", "D": "E - C - C - C.", "E": "C - C - E - E."}, "a": "A"}, {"id": "estrela26-ei-33", "ex": "estrela26-ei", "n": 33, "c": "esp", "s": "De acordo com a teoria de desenvolvimento humano e aprendizagem de Vygotsky, avaliar se as afirmativas são certas (C) ou erradas (E) e assinalar a sequência correspondente. (_) A zona de desenvolvimento proximal (ZDP) é um dos conceitos centrais nessa teoria. (_) A relação entre o homem e o mundo não é direta, mas sempre mediada por sistemas simbólicos. (_) O autor ressalta que a aprendizagem deve ser vista como resultado e não como processo.", "o": {"A": "E - C - E.", "B": "E - C - C.", "C": "C - E - E.", "D": "C - C - E.", "E": "E - E - E."}, "a": "D"}, {"id": "estrela26-ei-34", "ex": "estrela26-ei", "n": 34, "c": "esp", "s": "Em relação à educação ambiental, analisar os itens. I. É o conjunto das práticas pedagógicas de ensino e orientações informais sobre os comportamentos e atitudes necessários à preservação dos recursos naturais, envolvendo todas as ações que contemplem a manutenção da vida em suas diversas formas de flora e fauna. II. São os processos por meio dos quais o indivíduo e a coletividade constroem valores sociais, conhecimentos, habilidades, atitudes e competências voltados para a conservação do meio ambiente, bem de uso comum do povo, essencial à qualidade de vida e sua sustentabilidade. III. Contribui para a compreensão das causas e dos efeitos das crises ambientais e para a formação de cidadãos conscientes, entretanto, sua finalidade educativa circunscreve-se à apreensão conceitual dessas problemáticas, não abrangendo a revisão de hábitos cotidianos nem a construção de alternativas e inovações sustentáveis voltadas ao enfrentamento das mudanças climáticas. Está CORRETO o que se afirma:", "o": {"A": "Apenas no item I.", "B": "Apenas nos itens I e II.", "C": "Apenas nos itens I e III.", "D": "Apenas nos itens II e III.", "E": "Em todos os itens."}, "a": "B"}, {"id": "estrela26-ei-35", "ex": "estrela26-ei", "n": 35, "c": "esp", "s": "A respeito dos eixos estruturantes e dos campos de experiências da Educação Infantil, relacionar as colunas e assinalar a sequência correspondente. (1) Interações. (2) Brincadeira. (3) Corpo, gestos e movimentos. ( ) Situações nas quais as crianças estabelecem relações, negociam sentidos e aprendem com pares e adultos. ( ) Experiências lúdicas marcadas por imaginação, criação de papéis e transformação de objetos e situações. ( ) Campo que possibilita explorar espaços, sinais, sensações e formas de expressão corporal. ( ) Eixo materializado nas trocas sociais que integram a organização cotidiana das experiências pedagógicas.", "o": {"A": "2 - 1 - 3 - 2.", "B": "3 - 2 - 1 - 3.", "C": "1 - 2 - 3 - 1.", "D": "1 - 3 - 2 - 3.", "E": "2 - 3 - 1 - 1."}, "a": "C"}, {"id": "estrela26-ei-36", "ex": "estrela26-ei", "n": 36, "c": "esp", "s": "Em relação ao Transtorno de Déficit de Atenção e Hiperatividade (TDAH), analisar os itens. I. Consiste em uma capacidade de concentração ruim e/ou excesso de atividade e impulsividade impróprias para a idade da criança que interferem no seu desempenho ou desenvolvimento. II. Seus sintomas vão de leves a graves e podem tornar-se exagerados ou um problema em certos ambientes, como em casa ou na escola. As restrições da escola e estilos de vida organizados tornam o controle adequado do TDAH mais crítico. Embora alguns dos sintomas do TDAH possam também ocorrer em crianças sem esse transtorno, eles são mais frequentes e graves nas crianças que apresentam o déficit. III. É um distúrbio cerebral presente desde o nascimento ou que se desenvolve logo após o nascimento. Apresenta três formas: o desatento, o hiperativo/impulsivo e o combinado. Está CORRETO o que se afirma:", "o": {"A": "Apenas nos itens I e II.", "B": "Apenas nos itens I e III.", "C": "Apenas nos itens II e III.", "D": "Em nenhum dos itens.", "E": "Em todos os itens."}, "a": "A"}, {"id": "estrela26-ei-37", "ex": "estrela26-ei", "n": 37, "c": "esp", "s": "Uma professora de crianças pequenas reorganiza a sala para que diferentes materiais fiquem acessíveis, cria espaços para brincadeiras de pequenos grupos e prevê momentos de exploração livre e experiências orientadas. A rotina, embora possua referências estáveis, pode ser ajustada conforme os interesses e necessidades observados. Essa organização:", "o": {"A": "Reduz a importância do planejamento, pois as crianças passam a decidir todas as experiências.", "B": "Caracteriza uma rotina inadequada, pois a Educação Infantil exige horários rígidos para todas as atividades.", "C": "Prioriza a espontaneidade infantil e elimina a necessidade de intervenção docente.", "D": "Transforma o espaço em elemento secundário, já que o currículo deve ser desenvolvido por meio de atividades dirigidas.", "E": "Articula organização, intencionalidade pedagógica, autonomia e possibilidades de interação e exploração pelas crianças."}, "a": "E"}, {"id": "estrela26-ei-38", "ex": "estrela26-ei", "n": 38, "c": "esp", "s": "Durante uma atividade coletiva, uma criança demonstra dificuldade para acompanhar determinada proposta da mesma maneira que os colegas. A professora observa suas formas de comunicação e participação, adapta materiais e organiza diferentes possibilidades de envolvimento, mantendo a criança integrada ao grupo. A conduta da professora:", "o": {"A": "Caracteriza uma flexibilização que deve ocorrer somente quando a criança possuir algum diagnóstico formal.", "B": "Demonstra que crianças com necessidades específicas devem realizar atividades separadas das demais.", "C": "Indica que os objetivos pedagógicos devem ser retirados quando a criança apresenta dificuldades.", "D": "Favorece a participação da criança ao considerar suas singularidades e remover barreiras presentes na experiência educativa.", "E": "Transfere ao profissional especializado a responsabilidade pela participação da criança nas atividades da turma."}, "a": "D"}, {"id": "estrela26-ei-39", "ex": "estrela26-ei", "n": 39, "c": "esp", "s": "Durante uma sequência de experiências sobre sombras, as crianças começam a levantar hipóteses que não estavam previstas inicialmente pela professora. Algumas sugerem utilizar diferentes objetos; outras querem observar as sombras em horários distintos. A professora decide incorporar essas questões ao planejamento, reorganizando materiais e experiências sem perder de vista os objetivos pedagógicos inicialmente estabelecidos. Considerando as concepções de currículo e planejamento na Educação Infantil, a decisão da professora é:", "o": {"A": "Adequada, porque o abandono do planejamento inicial demonstra que as experiências das crianças devem sempre prevalecer sobre qualquer intencionalidade docente.", "B": "Inadequada, pois deve-se manter rigidamente o planejamento original, já que mudanças durante o percurso comprometem a organização curricular.", "C": "Adequada, porque transforma as hipóteses infantis em conteúdos obrigatórios, independentemente dos objetivos definidos para a experiência.", "D": "Adequada, pois substitui a mediação docente pela exploração espontânea das crianças, garantindo maior liberdade no processo.", "E": "Adequada, porque articula intencionalidade pedagógica e escuta das crianças, permitindo que o planejamento seja reorganizado a partir das experiências e interesses observados."}, "a": "E"}, {"id": "estrela26-ei-40", "ex": "estrela26-ei", "n": 40, "c": "esp", "s": "Em relação ao desenvolvimento linguístico, avaliar se as afirmativas são certas (C) ou erradas (E) e assinalar a sequência correspondente. ( ) A capacidade de adquirir a língua de seu grupo não é uma característica específica humana, porém supõe o desenvolvimento de um equipamento anatômico e neurofisiológico em adequado estado de funcionamento, visto que é um processo mecânico. ( ) É um processo de rápido desenvolvimento, através da formação das capacidades precedentes. ( ) Apoia-se em forte motivação para se comunicar verbalmente com outra pessoa, motivação parcialmente inata, mas enriquecida durante o primeiro ano de vida nas experiências interpessoais com a mãe, pai, irmãos e outros educadores.", "o": {"A": "C - C - E.", "B": "E - E - C.", "C": "C - E - E.", "D": "E - C - C.", "E": "E - E - E."}, "a": "B"}], "exams": [{"id": "estrela26-ai", "t": "Estrela/RS 2026 — Professor Anos Iniciais", "n": 40}, {"id": "estrela26-ei", "t": "Estrela/RS 2026 — Professor Educação Infantil", "n": 40}], "skip": {"leg": 20, "dep": 12}, "cargos": [["Professor (Anos Iniciais / Educação Infantil)", "30+CR"], ["Professor de Ciências", "02+CR"], ["Professor de Educação Física", "02+CR"], ["Professor de Geografia", "01+CR"], ["Professor de História", "02+CR"], ["Professor de Inglês", "01+CR"], ["Professor de Língua Portuguesa", "02+CR"], ["Professor de Matemática", "01+CR"]], "lib": [["edital de abertura.pdf", "Edital de Abertura nº 01/2026 — Conceição do Almeida/BA (Objetiva), 73 p., com nota “atualizado conforme edital 04/2026”", "Fonte primária: cargos, estrutura, cronograma, conteúdo"], ["2e6e7ec5-9188-408e-9270-f061a178cf7c.pdf", "Cópia anterior do mesmo edital (sem a nota de atualização 04/2026)", "Não usada (versão desatualizada)"], ["e42e867e-2522-4f0d-817e-2fe5ffb12280.pdf", "Edital nº 02/2026 — resultado preliminar de isenções", "Informativo; sem questões"], ["3.pdf", "Anexo III “Conteúdo programático — nível superior”, 35 p.; não cita Conceição do Almeida e difere do edital", "Não verificado para este concurso; não usado"], ["Conteudo_programatico_professores.pdf", "Anexo I — conteúdo de Português/Matemática de outro certame; não cita Conceição do Almeida", "Não verificado; não usado"], ["Estrela/RS 2026 — Professor Anos Iniciais (prova + gabarito)", "Caderno Objetiva, 40 questões; gabarito preliminar (arquivo reúne vários cargos)", "Prática interativa (questões autossuficientes)"], ["Estrela/RS 2026 — Professor Educação Infantil (prova + gabarito)", "Caderno Objetiva, 40 questões; gabarito preliminar", "Prática interativa"], ["Estrela/RS 2026 — Professor Artes, Contador, Monitor da Educação (provas + gabaritos)", "Cargos sem correspondência com o edital de Conceição do Almeida", "Inventariados; não importados"], ["Vista Alegre do Prata/RS 2025 — Professor Anos Iniciais (prova)", "Caderno Objetiva, 7 p.; sem gabarito nos arquivos enviados", "Não interativa: sem gabarito oficial. Envie o gabarito para incluir"], ["Estrela/RS 2026 — gabaritos (5 arquivos)", "Cinco PDFs de gabarito preliminar que reúnem todos os cargos do concurso", "Usados só na linha do cargo correspondente"]]};

function md(t){const blocks=[];let h=esc(t).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(m,c)=>{blocks.push(c.replace(/\n$/,''));return '\u0000'+(blocks.length-1)+'\u0000'});
 const inl=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>').replace(/\[(Edital|Material|Geral)\]/g,'<span class="src $1">$1</span>').replace(/class="src (\w+)"/g,(m,x)=>`class="src ${x==='Edital'?'edital':x==='Material'?'video':'ia'}"`);
 let out='',list=null;const close=()=>{if(list){out+='</'+list+'>';list=null}};
 for(const l of h.split('\n')){let m;
  if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){close();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>'}
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();out+='<ol>';list='ol'}out+='<li>'+inl(m[1])+'</li>'}
  else if(m=l.match(/^#{1,4}\s+(.*)/)){close();out+='<h4>'+inl(m[1])+'</h4>'}
  else if(/^\u0000\d+\u0000$/.test(l.trim())){close();out+=l.trim()}
  else if(!l.trim()){close()}
  else{close();out+='<p>'+inl(l)+'</p>'}}
 close();return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<pre><code>'+blocks[+i]+'</code></pre>')}

function quickSum(e){e.preventDefault();const u=document.getElementById('hurl').value.trim();if(!u)return false;AIS.url=u;AIS.key='';AIS.st='idle';AIS.res=null;AIS.err=null;go('resumir');if(detect(u))doSum();return false}
V.home=()=>{const d=Math.ceil((examDate()-Date.now())/DAY),cur=curTopic(),all=allTopics(),done=all.filter(x=>S.syl[x.k]===2).length,p=pct(done,all.length),
 today=S.hist.filter(x=>new Date(x.t).toDateString()===new Date().toDateString()).length,goal=Math.max(5,Math.round(S.plan.h*8)),
 dueQ=dueList().length,dueC=S.cards.filter(c=>c.due<=Date.now()).length,st=streak(),hr=new Date().getHours(),
 ms=['lp','mat','esp'].map(c=>[c,mast(c)]),rec=ms.filter(x=>x[1].n).sort((a,b)=>a[1].acc-b[1].acc)[0]||ms[2],rc=rec[0],
 recent=S.lib.slice(0,3);
 return `<h1>${hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite'}. O que vamos estudar?</h1><p class="sub">${S.last?'Última atividade: '+esc(S.last.t):'Comece pelo primeiro tópico do edital.'}</p>
 <div class="c hero"><div class="mut" style="color:#C9D2C3">Continue estudando</div><h2 style="font-size:22px;margin:4px 0 2px">${esc(cur.t)}</h2><div style="color:#C9D2C3;font-size:14px">${esc(SHORT[cur.c])} · ${esc(CN[cur.c])}</div><button class="btn r" style="margin-top:16px" onclick="${S.last&&S.last.r&&S.last.r!=='trilha'?`go('${S.last.r}')`:`openTopic('${cur.k}')`}">Continuar</button> <button class="btn o" style="margin-top:16px;color:#F7F6F2;border-color:rgba(255,255,255,.3)" onclick="openTopic('${cur.k}')">Abrir tópico</button></div>
 <form class="c soft" style="margin-top:14px" onsubmit="return quickSum(event)"><h2 style="margin-bottom:4px">Resumir uma videoaula</h2><p class="mut" style="margin:0 0 12px">Cole um link do YouTube, Instagram ou TikTok.</p><div class="urlbox"><input type="url" id="hurl" inputmode="url" aria-label="Link do vídeo" placeholder="Cole seu link de vídeo aqui…"><button class="btn" type="submit">Resumir vídeo</button></div></form>
 <div class="g g2" style="margin-top:14px"><div class="c top"><div class="sp">${d>0?`<div class="big">${d}</div><div>dias para a prova</div>`:'<b>Prova realizada</b>'}<div class="mut" style="margin-top:6px">${examDate().toLocaleDateString('pt-BR')} · <a href="#perfil/edital">confirmar data</a></div><div style="margin-top:10px"><span class="tag ${st?'g1':''}">${st?st+' dia(s) seguidos':'Sem sequência hoje'}</span></div></div><div class="ringw">${ring(p)}<div class="mut" style="font-size:12px">${done}/${all.length} tópicos</div></div></div>
 <div class="c"><h3>Meta de hoje</h3><div style="font-size:26px;font-weight:700;font-family:var(--hd)">${today}<span class="mut" style="font-weight:500"> / ${goal} questões</span></div>${bar(Math.min(100,pct(today,goal)))}<button class="btn o sm" style="margin-top:14px" onclick="go('praticar')">Praticar questões</button></div></div>
 <div class="g g2" style="margin-top:14px"><div class="c"><h3>Matéria recomendada</h3><b style="font-family:var(--hd);font-size:18px">${esc(CN[rc])}</b><p class="mut" style="margin:6px 0 12px">${rec[1].n?`Seu acerto ponderado é ${rec[1].acc}%.`:'Ainda sem questões respondidas. Peso de 40 das 60 questões.'}</p><button class="btn o sm" onclick="S.course='${rc}';go('trilha')">Estudar</button></div>
 <div class="c"><h3>Revisão</h3><b style="font-family:var(--hd);font-size:18px">${dueQ+dueC?`${dueQ} questões · ${dueC} cartões`:'Tudo em dia'}</b><p class="mut" style="margin:6px 0 12px">${dueQ+dueC?'Vencidas hoje.':'Sem revisões vencidas.'}</p><div class="row"><button class="btn o sm" ${dueQ?'':'disabled'} onclick="startP('due')">Questões</button><button class="btn o sm" ${dueC?'':'disabled'} onclick="go('cartoes')">Cartões</button></div></div></div>
 ${recent.length?`<h2 style="margin-top:28px">Resumos recentes</h2><div class="c list">${recent.map(l=>`<button class="li" onclick="openSum('${l.id}')"><span class="row" style="flex-wrap:nowrap">${th2(l)}<span><b>${esc(l.title)}</b><small>${esc(PN[l.plat||'youtube'])} · ${esc(l.topic)}</small></span></span><i>›</i></button>`).join('')}</div>`:''}
 <div class="g g2" style="margin-top:14px"><button class="c li" style="border:1px solid var(--bd)" onclick="go('simulado')"><span><b>Fazer um simulado</b><small>Ambiente de prova com cronômetro</small></span><i>›</i></button><button class="c li" style="border:1px solid var(--bd)" onclick="go('chat')"><span><b>Perguntar ao assistente</b><small>Edital, questões e dúvidas</small></span><i>›</i></button></div>`};
/* ---------- ajustes: teste do servidor ---------- */
const cfg0=V.config;
async function testApi(){AIS.health={loading:1};render();try{const r=await fetch(apiBase()+'/api/health');AIS.health=await r.json()}catch(e){AIS.health={error:1}}render()}
function saveKey(){const v=document.getElementById('akey').value.trim();S.akey=v;save();toast(v?'Chave salva neste navegador':'Chave removida');render()}
V.config=()=>{const h=AIS.health,b=apiBase();return cfg0()+`<div class="c form" style="margin-top:16px"><h2>IA dentro do HTML (sua chave)</h2><p class="mut">Faz o assistente, as questões, os cartões e o resumo de transcrições funcionarem sem servidor. A chave fica salva só neste navegador e é enviada apenas à Anthropic. Use em computador pessoal; para uso público, prefira o servidor.</p><label>Chave da API Anthropic<input type="password" id="akey" autocomplete="off" value="${esc(S.akey||'')}" placeholder="sk-ant-..."></label><div class="row"><button class="btn sm" onclick="saveKey()">Salvar chave</button><span class="mut">${S.akey?'Chave salva ✓':'Nenhuma chave salva'}</span></div></div><div class="c" style="margin-top:16px"><h2>Servidor de IA (resumo por link)</h2><p class="mut">${b?'Endereço em uso: '+esc(b):'Nenhum servidor configurado.'}</p><button class="btn o sm" ${b?'':'disabled'} onclick="testApi()">Testar conexão</button>${h?(h.loading?'<p><span class="spin"></span> Testando…</p>':h.error?'<p class="err" role="alert">Não foi possível conectar.</p>':`<table style="margin-top:10px"><tr><td>IA (chave no servidor)</td><td>${h.ai?'configurada':'ausente'}</td></tr><tr><td>Metadados (oEmbed)</td><td>${h.providers&&h.providers.oembed?'ativo':'inativo'}</td></tr><tr><td>Instagram oEmbed</td><td>${h.providers&&h.providers.instagramOembed?'ativo':'inativo'}</td></tr><tr><td>Legendas do YouTube (opt-in)</td><td>${h.providers&&h.providers.youtubeCaptions?'ativo':'inativo'}</td></tr><tr><td>Provedor externo de transcrição</td><td>${h.providers&&h.providers.transcriptApi?'ativo':'inativo'}</td></tr></table>`):''}</div>`};
/* ---------- inicialização ---------- */
if(/^https?:/.test(location.protocol)&&!S.api)fetch('/api/health').then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ok&&j.service==='aprova-ai'){AIS.same=1;render()}}).catch(()=>{});
addEventListener('hashchange',render);render();
setInterval(()=>{if(/^#?(home.*)?$/.test(location.hash)&&!AIS.busy&&!document.activeElement.matches('input,textarea'))render()},60000);
</script>
